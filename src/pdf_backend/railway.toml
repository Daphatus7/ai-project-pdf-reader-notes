# Railway configuration for pdf-backend API service.
# The worker service is a separate Railway Service pointing to the same repo
# with build.dockerfileTarget = "worker".

[build]
dockerfilePath = "src/pdf_backend/Dockerfile"
dockerContext = "."
dockerfileTarget = "production"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Scale policy: Railway scales replicas based on CPU usage.
# Keep pdf-api at 1 replica (stateless, lightweight).
[deploy.scaling]
minReplicas = 1
maxReplicas = 1
