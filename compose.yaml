services:
  # Redis service
  redis:
    image: redis/redis-stack-server:latest

  # Backend service - FastAPI with LLM integration
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload in development
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Frontend service - React/Vite application
  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload in development
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Blog service - Astro static site behind Caddy (production image)
  blog:
    build:
      context: ./src/astroblog
      dockerfile: Dockerfile
    environment:
      - PORT=8080

  # Frontend production image - Caddy gateway (SPA + /blog reverse proxy)
  # 用于本地验证生产部署形态，与 dev 用的 frontend 服务并存
  frontend-prod:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      # 不指定 target = 最终 Caddy stage
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - BLOG_UPSTREAM=http://blog:8080
    depends_on:
      - blog
      - backend
