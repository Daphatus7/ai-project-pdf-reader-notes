services:
  # Redis service
  redis:
    image: redis/redis-stack-server:latest

  # Backend service - FastAPI with LLM integration
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload in development
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Frontend service - React/Vite application
  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload in development
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
